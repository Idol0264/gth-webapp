<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>GTH | Offline</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: #ffffff;

      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      text-align: center;
    }


    .offline {

      width: min(420px, 100%);

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    .offline-logo {

      width: 96px;
      height: 96px;

      object-fit: contain;

      margin-bottom: 38px;
    }


    .offline-symbol {

      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 10px;

      font-size: 38px;

      line-height: 1;

      color: #111111;
    }


    .offline h1 {

      margin: 0;

      font-size: 32px;

      line-height: 1.2;

      font-weight: 500;

      letter-spacing: -.03em;
    }


    .offline p {

      max-width: 320px;

      margin:
        14px auto
        0;

      color: #666666;

      font-size: 15px;

      line-height: 1.6;
    }


    .offline button {

      margin-top: 25px;

      min-height: 48px;

      padding:
        12px
        24px;

      border: 0;

      border-radius: 999px;

      background: #111111;

      color: #ffffff;

      font: inherit;

      font-weight: 800;

      cursor: pointer;
    }


    .offline button:active {
      transform: scale(.97);
    }

  </style>

</head>


<body>

  <main class="offline">

    <img
      src="gth-icon.svg"
      alt="GTH"
      class="offline-logo"
    >


    <div
      class="offline-symbol"
      aria-hidden="true"
      >
      <span class="offline-cloud"></span>
      <span class="offline-cloud-slash"></span>
    </div>


    <h1>
      You're offline
    </h1>


    <p>
      GTH could not connect to the internet right now.
      Please check your connection and try again.
    </p>


    <button
      type="button"
      onclick="location.reload()"
    >
      Try again
    </button>

  </main>

</body>

</html>
