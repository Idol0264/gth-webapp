<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L.O.LDay | GTC</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
const savedTheme = localStorage.getItem("gth_theme_v1");

if (
  savedTheme === "gold" ||
  savedTheme === "blue" ||
  savedTheme === "green"
) {
  document.body.setAttribute("data-theme", savedTheme);
}
</script>

<header class="site-header">
  <a href="index.html" class="brand">GTH</a>

  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="gtc.html">GTC</a>
  </nav>
</header>

<main>

  <section class="hero">
    <span class="platform-code">GTC</span>
    <h1>L.O.LDay</h1>
    <p>
      Entertainment, comedy and fun.
    </p>
  </section>

  <section class="section">
    <div class="search-box">
      <input
        type="search"
        id="gallerySearch"
        placeholder="Search L.O.LDay videos..."
        autocomplete="off"
      >
    </div>
  </section>

  <section class="section">
    <div id="gallery"></div>

    <p id="noResults" style="display:none; text-align:center; opacity:.7;">
      No videos found.
    </p>
  </section>

</main>

<footer class="site-footer">
  <p>© GTH — God’stime Holdings</p>
</footer>

<script src="data/gtc-lolday.js"></script>
  <script src="data/gtc-ads.js"></script>

<script>
const gallery = document.getElementById("gallery");
const searchInput = document.getElementById("gallerySearch");
const noResults = document.getElementById("noResults");

const shorts = GTC_LOLDAY.shorts || [];
const fullVideos = GTC_LOLDAY.fullVideos || [];

function createVideo(video, type) {
  const article = document.createElement("article");

  article.className =
    type === "short"
      ? "video-card short-card"
      : "video-card full-card";

  article.dataset.title = video.title.toLowerCase();

  article.innerHTML = `
    <div class="video-frame">
      <iframe
        src="https://www.youtube.com/embed/${video.id}"
        title="${video.title}"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </div>

    <h3>${video.title}</h3>
  `;

  return article;
}

function createAdvertisement() {
  const ad = document.createElement("div");
  ad.className = "gtc-ad";

  const ads = Array.isArray(window.GTC_ADS)
    ? window.GTC_ADS
    : [];

  const randomAd = ads.length
    ? ads[Math.floor(Math.random() * ads.length)]
    : null;

  /*
   * GOOGLE ADS AREA
   *
   * This space remains available for Google Ads.
   * If Google successfully displays an ad here,
   * gtcGoogleAdDisplayed(ad) can be called.
   */
  const googleAd = document.createElement("div");
  googleAd.className = "gtc-google-ad";
  googleAd.setAttribute("aria-label", "Advertisement");

  /*
   * GTH JPG FALLBACK
   */
  const fallback = document.createElement("div");
  fallback.className = "gtc-jpg-ad";

  if (!randomAd) {

    fallback.innerHTML = `
      <div class="ad-placeholder">

        <span class="ad-placeholder-label">
          ADVERTISEMENT
        </span>

        <strong>
          GTH promotional space
        </strong>

        <small>
          More promotions coming soon
        </small>

      </div>
    `;

  } else {

    fallback.innerHTML = `
      <div
        class="gtc-ad-link"
        role="button"
        tabindex="0"
        aria-label="${randomAd.title || "GTH advertisement"}"
      >

        <img
          src="${randomAd.image}"
          alt="${randomAd.title || "GTH advertisement"}"
          loading="lazy"
        >

        <div class="gtc-ad-overlay">
          <span>GTH</span>
          <span>ADVERTISEMENT</span>
        </div>

      </div>
    `;

    const adLink =
      fallback.querySelector(".gtc-ad-link");

    function animateAd(event) {

      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      adLink.classList.remove("is-tapped");

      /*
       * Force the browser to restart
       * the tap animation.
       */
      void adLink.offsetWidth;

      adLink.classList.add("is-tapped");
    }

    adLink.addEventListener(
      "click",
      animateAd
    );

    adLink.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {
          animateAd(event);
        }

      }
    );
  }

  /*
   * Google advertisement space
   */
  ad.appendChild(googleAd);

  /*
   * JPG fallback advertisement
   */
  ad.appendChild(fallback);

  /*
   * Called when Google has actually
   * rendered an advertisement.
   */
  window.gtcGoogleAdDisplayed =
    function(targetAd) {

      if (!targetAd || targetAd !== ad) {
        return;
      }

      ad.classList.add(
        "google-ad-active"
      );
    };

  return ad;
}

/*
  Formation:

  2 Shorts
  2 Shorts
  4 Full Videos
  Advertisement
*/
function createFormation(shortItems, fullItems) {

  const formation = document.createElement("section");

  formation.className = "gtc-formation";

  if (shortItems.length > 0) {

    const row1 = document.createElement("div");

    row1.className = "shorts-grid";

    shortItems.slice(0, 2).forEach(video => {
      row1.appendChild(
        createVideo(video, "short")
      );
    });

    formation.appendChild(row1);
  }

  if (shortItems.length > 2) {

    const row2 = document.createElement("div");

    row2.className = "shorts-grid";

    shortItems.slice(2, 4).forEach(video => {
      row2.appendChild(
        createVideo(video, "short")
      );
    });

    formation.appendChild(row2);
  }

  if (fullItems.length > 0) {

    const fullList = document.createElement("div");

    fullList.className = "full-video-list";

    fullItems.slice(0, 4).forEach(video => {
      fullList.appendChild(
        createVideo(video, "full")
      );
    });

    formation.appendChild(fullList);
  }

  formation.appendChild(
    createAdvertisement()
  );

  return formation;
}

function buildGallery() {

  gallery.innerHTML = "";

  let shortIndex = 0;
  let fullIndex = 0;

  while (
    shortIndex < shorts.length ||
    fullIndex < fullVideos.length
  ) {

    const formationShorts = shorts.slice(
      shortIndex,
      shortIndex + 4
    );

    const formationFull = fullVideos.slice(
      fullIndex,
      fullIndex + 4
    );

    if (
      formationShorts.length === 0 &&
      formationFull.length === 0
    ) {
      break;
    }

    gallery.appendChild(
      createFormation(
        formationShorts,
        formationFull
      )
    );

    shortIndex += 4;
    fullIndex += 4;
  }

  applySearch();
}

function applySearch() {

  const query = searchInput.value
    .trim()
    .toLowerCase();

  const cards =
    gallery.querySelectorAll(".video-card");

  let visibleCount = 0;

  cards.forEach(card => {

    const title =
      card.dataset.title || "";

    if (
      !query ||
      title.includes(query)
    ) {
      card.style.display = "";
      visibleCount++;
    } else {
      card.style.display = "none";
    }
  });

  noResults.style.display =
    visibleCount === 0
      ? "block"
      : "none";
}

searchInput.addEventListener(
  "input",
  applySearch
);

buildGallery();
</script>

</body>
</html>
