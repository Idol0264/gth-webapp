<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>

    <!-- Metallic gold -->
    <radialGradient id="goldMetal" cx="35%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFF4B0"/>
      <stop offset="18%" stop-color="#FFD966"/>
      <stop offset="38%" stop-color="#D09A33"/>
      <stop offset="58%" stop-color="#8A5A12"/>
      <stop offset="72%" stop-color="#E6B84A"/>
      <stop offset="88%" stop-color="#A86F16"/>
      <stop offset="100%" stop-color="#5E3908"/>
    </radialGradient>

    <!-- Gold ring -->
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A6"/>
      <stop offset="25%" stop-color="#F6C84E"/>
      <stop offset="50%" stop-color="#B87917"/>
      <stop offset="75%" stop-color="#FFD866"/>
      <stop offset="100%" stop-color="#8A560C"/>
    </linearGradient>

    <!-- GTH gold -->
    <linearGradient id="letterGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A3"/>
      <stop offset="22%" stop-color="#FFD45A"/>
      <stop offset="52%" stop-color="#D69B2E"/>
      <stop offset="78%" stop-color="#9B6411"/>
      <stop offset="100%" stop-color="#F0B83F"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="9"
        flood-color="#000000"
        flood-opacity="0.75"/>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

  </defs>


  <!-- Dark app background -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="#090909"/>


  <!-- Inner dark surface -->
  <circle
    cx="256"
    cy="256"
    r="224"
    fill="#111111"/>


  <!-- Subtle gold glow -->
  <circle
    cx="256"
    cy="256"
    r="196"
    fill="none"
    stroke="#D09A33"
    stroke-width="18"
    opacity="0.22"
    filter="url(#softGlow)"/>


  <!-- Main gold circular ring -->
  <circle
    cx="256"
    cy="256"
    r="190"
    fill="#0B0B0B"
    stroke="url(#goldEdge)"
    stroke-width="24"
    filter="url(#shadow)"/>


  <!-- Inner circular edge -->
  <circle
    cx="256"
    cy="256"
    r="166"
    fill="#101010"
    stroke="#6E460B"
    stroke-width="5"/>


  <!-- GTH shadow -->
  <text
    x="256"
    y="285"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="126"
    font-weight="900"
    letter-spacing="-7"
    fill="#5B3706"
    opacity="0.9">
    GTH
  </text>


  <!-- Main raised GTH -->
  <text
    x="256"
    y="275"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="126"
    font-weight="900"
    letter-spacing="-7"
    fill="url(#letterGold)"
    stroke="#6A4108"
    stroke-width="3"
    paint-order="stroke">
    GTH
  </text>


  <!-- Fine metallic highlight -->
  <text
    x="256"
    y="269"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="126"
    font-weight="900"
    letter-spacing="-7"
    fill="none"
    stroke="#FFF0A0"
    stroke-width="1.5"
    opacity="0.7">
    GTH
  </text>


  <!-- Inner metallic highlight -->
  <circle
    cx="256"
    cy="256"
    r="176"
    fill="none"
    stroke="#FFE48A"
    stroke-width="2"
    opacity="0.45"/>

</svg>
