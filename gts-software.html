<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Software details from GT Softwares."
  >

  <title>Software | GTS</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body class="gts-page">


<script>

const savedTheme =
  localStorage.getItem("gth_theme_v1");


if (
  savedTheme === "gold" ||
  savedTheme === "blue" ||
  savedTheme === "green"
) {

  document.body.setAttribute(
    "data-theme",
    savedTheme
  );

}

</script>


<header class="site-header">

  <a
    href="gts.html"
    class="brand"
  >

    <strong>
      GTS
    </strong>

    <span>
      GT Softwares
    </span>

  </a>


  <nav class="top-nav">

    <a href="index.html">
      GTH Home
    </a>

    <a href="gts.html">
      GTS
    </a>

  </nav>

</header>


<main>

  <!-- =====================================================
       DETAIL HERO
  ====================================================== -->

  <section class="gts-detail-hero">

    <div class="gts-detail-hero-inner">

      <a
        href="gts.html"
        class="gts-back-link"
      >
        ← Back to GT Softwares
      </a>


      <div
        id="detailHeroBadge"
        class="gts-detail-badges"
      ></div>


      <h1 id="softwareName">
        Loading...
      </h1>


      <p id="softwareDescription">
        Loading software information...
      </p>

    </div>

  </section>


  <!-- =====================================================
       DETAILS
  ====================================================== -->

  <section class="content-section">

    <div
      id="softwareDetails"
      class="gts-detail-layout"
    >

      <div class="gts-loading-card">

        <span class="gts-loading-dot"></span>

        Loading software details...

      </div>

    </div>

  </section>

</main>


<footer class="site-footer">

  <p>
    © 2026 God’stime Holdings. All rights reserved.
  </p>

</footer>


<script src="data/gts-software.js"></script>


<script>

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function validExternalUrl(url) {

  if (
    typeof url !== "string" ||
    !url.trim() ||
    url.trim() === "#"
  ) {
    return "";
  }


  try {

    const parsed =
      new URL(url);


    if (
      parsed.protocol !== "http:" &&
      parsed.protocol !== "https:"
    ) {
      return "";
    }


    return parsed.href;

  } catch {

    return "";

  }

}


/* =========================================================
   GET SOFTWARE
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const softwareId =
  params.get("id");


const software =
  GTS_SOFTWARE.find(
    item =>
      item.id === softwareId
  );


const softwareName =
  document.getElementById(
    "softwareName"
  );


const softwareDescription =
  document.getElementById(
    "softwareDescription"
  );


const softwareDetails =
  document.getElementById(
    "softwareDetails"
  );


const detailHeroBadge =
  document.getElementById(
    "detailHeroBadge"
  );


/* =========================================================
   NOT FOUND
========================================================= */

if (!software) {

  document.title =
    "Software Not Found | GTS";


  softwareName.textContent =
    "Software Not Found";


  softwareDescription.textContent =
    "The requested software could not be found.";


  softwareDetails.innerHTML = `

    <div class="gts-not-found-card">

      <div class="gts-not-found-icon">
        !
      </div>

      <h2>
        Software unavailable
      </h2>

      <p>
        This software listing does not exist
        or may have been removed from GTS.
      </p>

      <a
        href="gts.html"
        class="gts-detail-button"
      >
        Return to GTS →
      </a>

    </div>

  `;

}


/* =========================================================
   SOFTWARE FOUND
========================================================= */

else {

  document.title =
    `${software.name} | GTS`;


  softwareName.textContent =
    software.name;


  softwareDescription.textContent =
    software.description;


  const category =
    escapeHtml(
      software.category || "SOFTWARE"
    );


  const isExample =
    software.isExample === true;


  detailHeroBadge.innerHTML = `

    <span class="platform-code">
      ${category}
    </span>

    ${
      isExample
        ? `
          <span class="gts-example-badge">
            EXAMPLE
          </span>
        `
        : ""
    }

  `;


  /* =======================================================
     PLATFORM BUTTONS
  ====================================================== */

  const platforms =
    software.platforms || {};


  let platformButtons = "";


  const web =
    validExternalUrl(platforms.web);


  const android =
    validExternalUrl(platforms.android);


  const ios =
    validExternalUrl(platforms.ios);


  const windows =
    validExternalUrl(platforms.windows);


  if (web) {

    platformButtons += `

      <a
        href="${escapeHtml(web)}"
        class="gts-detail-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Web App →
      </a>

    `;

  }


  if (android) {

    platformButtons += `

      <a
        href="${escapeHtml(android)}"
        class="gts-detail-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Get Android App →
      </a>

    `;

  }


  if (ios) {

    platformButtons += `

      <a
        href="${escapeHtml(ios)}"
        class="gts-detail-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Get iOS App →
      </a>

    `;

  }


  if (windows) {

    platformButtons += `

      <a
        href="${escapeHtml(windows)}"
        class="gts-detail-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Download for Windows →
      </a>

    `;

  }


  /* =======================================================
     ABOUT
  ====================================================== */

  const aboutText =
    software.about ||
    software.description ||
    "Information about this software is currently unavailable.";


  const developer =
    software.developer ||
    "Not currently available";


  const developerInfo =
    software.developerInfo ||
    "Developer information is currently unavailable.";


  /* =======================================================
     PLATFORM REACH
  ====================================================== */

  let platformReachHTML = "";


  if (
    software.platformReach &&
    software.platformReachLabel
  ) {

    platformReachHTML = `

      <div class="gts-stat-card">

        <span class="gts-stat-label">
          ${escapeHtml(
            software.platformReachLabel
          )}
        </span>

        <strong>
          ${escapeHtml(
            software.platformReach
          )}
        </strong>

      </div>

    `;

  }


  /* =======================================================
     EXAMPLE NOTICE
  ====================================================== */

  const exampleNotice =
    isExample
      ? `

        <div class="gts-detail-example">

          <strong>
            EXAMPLE SOFTWARE
          </strong>

          <p>
            This is a demonstration listing
            used as an example of how software
            can appear inside GTS.
          </p>

          <p>
            Replace its placeholder platform
            information when a real software
            listing is ready.
          </p>

        </div>

      `
      : "";


  /* =======================================================
     MAIN DETAIL HTML
  ====================================================== */

  softwareDetails.innerHTML = `

    <div class="gts-detail-main">


      <div class="gts-detail-image-card">

        <img
          src="${escapeHtml(software.image)}"
          alt="${escapeHtml(software.name)}"
          class="gts-detail-image"
        >

      </div>


      <div class="gts-detail-content">

        ${exampleNotice}


        <div class="gts-detail-section">

          <span class="platform-code">
            ${category}
          </span>

          <h2>
            About ${escapeHtml(software.name)}
          </h2>

          <div
            class="gts-about-text"
            id="aboutText"
          >

            <p>
              ${escapeHtml(aboutText)}
            </p>

          </div>


          <button
            type="button"
            class="gts-read-more"
            id="aboutToggle"
          >
            Read More →
          </button>

        </div>


        <div class="gts-detail-section">

          <p class="eyebrow">
            DEVELOPER
          </p>

          <h2>
            ${escapeHtml(developer)}
          </h2>

          <p>
            ${escapeHtml(developerInfo)}
          </p>

        </div>


        ${
          platformReachHTML
            ? `

              <div class="gts-detail-section">

                <p class="eyebrow">
                  PLATFORM REACH
                </p>

                <div class="gts-stat-grid">

                  ${platformReachHTML}

                </div>

              </div>

            `
            : ""
        }


        ${
          platformButtons
            ? `

              <div class="gts-detail-section">

                <p class="eyebrow">
                  ACCESS
                </p>

                <h2>
                  Available Platforms
                </h2>

                <div class="gts-detail-buttons">

                  ${platformButtons}

                </div>

              </div>

            `
            : `
              <div class="gts-platform-disabled detail-disabled">
                No active platform link is currently connected.
              </div>
            `
        }

      </div>

    </div>


    <div class="gts-detail-bottom">

      <a
        href="gts.html"
        class="gts-back-button"
      >
        ← Back to GT Softwares
      </a>

    </div>

  `;


  /* =======================================================
     READ MORE
  ====================================================== */

  const aboutTextElement =
    document.getElementById(
      "aboutText"
    );


  const aboutToggle =
    document.getElementById(
      "aboutToggle"
    );


  if (
    aboutTextElement &&
    aboutToggle
  ) {

    aboutToggle.addEventListener(
      "click",
      () => {

        const expanded =
          aboutTextElement.classList.toggle(
            "expanded"
          );


        aboutToggle.textContent =
          expanded
            ? "Show Less ↑"
            : "Read More →";

      }
    );

  }

}

</script>


</body>
</html>
