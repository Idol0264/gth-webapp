<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Software | GTS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
const savedTheme = localStorage.getItem("gth_theme_v1");

if (
  savedTheme === "gold" ||
  savedTheme === "blue" ||
  savedTheme === "green"
) {
  document.body.setAttribute("data-theme", savedTheme);
}
</script>


<header class="site-header">

  <div class="brand">
    <strong>GTS</strong>
    <span>GT Softwares</span>
  </div>

  <nav class="top-nav">

    <a href="index.html">GTH Home</a>

    <a href="gts.html">GTS</a>

  </nav>

</header>


<main>

  <!-- SOFTWARE DETAILS -->

  <section class="hero">

    <div class="hero-content">

      <p class="eyebrow">
        GTS SOFTWARE
      </p>

      <h1 id="softwareName">
        Loading...
      </h1>

      <p id="softwareDescription">
        Loading software information...
      </p>

    </div>

  </section>


  <section class="content-section">

    <div
      id="softwareDetails"
      class="platform-card"
    >

      <p>
        Loading software details...
      </p>

    </div>

  </section>


  <section class="content-section">

    <div class="hero-actions">

      <a
        href="gts.html"
        class="secondary-btn"
      >
        ← Back to GTS
      </a>

    </div>

  </section>

</main>


<footer class="site-footer">

  <p>
    © 2026 God’stime Holdings. All rights reserved.
  </p>

</footer>


<script src="data/gts-software.js"></script>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const softwareId =
  params.get("id");


const software =
  GTS_SOFTWARE.find(
    item => item.id === softwareId
  );


const softwareName =
  document.getElementById(
    "softwareName"
  );

const softwareDescription =
  document.getElementById(
    "softwareDescription"
  );

const softwareDetails =
  document.getElementById(
    "softwareDetails"
  );


if (!software) {

  softwareName.textContent =
    "Software Not Found";

  softwareDescription.textContent =
    "The requested software could not be found.";

  softwareDetails.innerHTML = `

    <h3>
      Software unavailable
    </h3>

    <p>
      This software listing does not exist
      or may have been removed from GTS.
    </p>

  `;

} else {

  document.title =
    `${software.name} | GTS`;

  softwareName.textContent =
    software.name;

  softwareDescription.textContent =
    software.description;


  let platformButtons = "";


  if (software.platforms?.web) {

    platformButtons += `

      <a
        href="${software.platforms.web}"
        class="gts-platform-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Web App →
      </a>

    `;

  }


  if (software.platforms?.android) {

    platformButtons += `

      <a
        href="${software.platforms.android}"
        class="gts-platform-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Get Android App →
      </a>

    `;

  }


  if (software.platforms?.ios) {

    platformButtons += `

      <a
        href="${software.platforms.ios}"
        class="gts-platform-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Get iOS App →
      </a>

    `;

  }


  if (software.platforms?.windows) {

    platformButtons += `

      <a
        href="${software.platforms.windows}"
        class="gts-platform-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Download for Windows →
      </a>

    `;

  }


  softwareDetails.innerHTML = `

    <img
      src="${software.image}"
      alt="${software.name}"
      class="gts-software-image"
    >


    <span class="platform-code">
      ${software.category}
    </span>


    <h2>
      ${software.name}
    </h2>


    <p>
      ${software.description}
    </p>


    <div class="gts-platform-buttons">

      ${platformButtons}

    </div>

  `;

}

</script>

</body>

  </html>
