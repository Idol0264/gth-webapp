<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | GTH</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">
      <span>GT</span>H
    </a>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="index.html#connect">GT Connect</a>
      <a href="index.html#services">Services</a>
      <a href="signup.html">Sign Up</a>
    </nav>
  </header>


  <main>

    <section class="auth-section">

      <div class="auth-container">

        <p class="eyebrow">GOD'STIME HOLDINGS</p>

        <h1>Welcome back.</h1>

        <p class="auth-intro">
          Log in to your GTH account to access your dashboard
          and the GTH ecosystem.
        </p>


        <form id="loginForm">

          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >


          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >


          <button type="submit" class="primary-button auth-button">
            Log In
          </button>

          <p id="loginMessage" class="auth-message"></p>

        </form>


        <p class="auth-switch">
          Don't have an account?
          <a href="signup.html">Create one</a>
        </p>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="footer-logo">
      <span>GT</span>H
    </div>

    <p>God'stime Holdings</p>

    <p class="copyright">
      © 2026 God'stime Holdings. All rights reserved.
    </p>

  </footer>


  <script>
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      loginMessage.textContent =
        "Your login form is ready. We will connect it to the GTH account system next.";
    });
  </script>

</body>
  </html>
