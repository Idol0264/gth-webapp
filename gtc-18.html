<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>+18 Series | GTC</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <a href="index.html" class="brand">GTH</a>

  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="gtc.html">GTC</a>
  </nav>
</header>

<main>

  <section class="hero">
    <span class="platform-code">GTC</span>
    <h1>+18 Series</h1>
    <p>
      Series and entertainment intended for adult audiences.
    </p>
  </section>

  <section class="section">
    <div class="search-box">
      <input
        type="search"
        id="gallerySearch"
        placeholder="Search +18 Series videos..."
        autocomplete="off"
      >
    </div>
  </section>

  <section class="section">
    <div id="gallery"></div>

    <p id="noResults" style="display:none; text-align:center; opacity:.7;">
      No videos found.
    </p>
  </section>

</main>

<footer class="site-footer">
  <p>© GTH — God’stime Holdings</p>
</footer>

<script src="data/gtc-18.js"></script>
  <script src="data/gtc-ads.js"></script>

<script>
const gallery = document.getElementById("gallery");
const searchInput = document.getElementById("gallerySearch");
const noResults = document.getElementById("noResults");

const shorts = GTC_18.shorts || [];
const fullVideos = GTC_18.fullVideos || [];

function createVideo(video, type) {
  const article = document.createElement("article");

  article.className =
    type === "short"
      ? "video-card short-card"
      : "video-card full-card";

  article.dataset.title = video.title.toLowerCase();

  article.innerHTML = `
    <div class="video-frame">
      <iframe
        src="https://www.youtube.com/embed/${video.id}"
        title="${video.title}"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </div>

    <h3>${video.title}</h3>
  `;

  return article;
}

function createAdvertisement() {
  const ad = document.createElement("div");
  ad.className = "gtc-ad";

  const randomAd =
    GTC_ADS[Math.floor(Math.random() * GTC_ADS.length)];

  if (!randomAd) {
    ad.innerHTML = `
      <div class="ad-placeholder">
        <strong>Advertisement</strong>
        <span>GTH promotional space</span>
      </div>
    `;
    return ad;
  }

  ad.innerHTML = `
    <a
      href="${randomAd.link}"
      style="display:block; text-decoration:none; color:inherit;"
    >
      <img
        src="${randomAd.image}"
        alt="${randomAd.title}"
        style="width:100%; display:block; border-radius:14px;"
      >
    </a>
  `;

  return ad;
}
/*
  Formation:

  2 Shorts
  2 Shorts
  4 Full Videos
  Advertisement
*/
function createFormation(shortItems, fullItems) {

  const formation = document.createElement("section");

  formation.className = "gtc-formation";

  if (shortItems.length > 0) {

    const row1 = document.createElement("div");

    row1.className = "shorts-grid";

    shortItems.slice(0, 2).forEach(video => {
      row1.appendChild(
        createVideo(video, "short")
      );
    });

    formation.appendChild(row1);
  }

  if (shortItems.length > 2) {

    const row2 = document.createElement("div");

    row2.className = "shorts-grid";

    shortItems.slice(2, 4).forEach(video => {
      row2.appendChild(
        createVideo(video, "short")
      );
    });

    formation.appendChild(row2);
  }

  if (fullItems.length > 0) {

    const fullList = document.createElement("div");

    fullList.className = "full-video-list";

    fullItems.slice(0, 4).forEach(video => {
      fullList.appendChild(
        createVideo(video, "full")
      );
    });

    formation.appendChild(fullList);
  }

  formation.appendChild(
    createAdvertisement()
  );

  return formation;
}

function buildGallery() {

  gallery.innerHTML = "";

  let shortIndex = 0;
  let fullIndex = 0;

  while (
    shortIndex < shorts.length ||
    fullIndex < fullVideos.length
  ) {

    const formationShorts = shorts.slice(
      shortIndex,
      shortIndex + 4
    );

    const formationFull = fullVideos.slice(
      fullIndex,
      fullIndex + 4
    );

    if (
      formationShorts.length === 0 &&
      formationFull.length === 0
    ) {
      break;
    }

    gallery.appendChild(
      createFormation(
        formationShorts,
        formationFull
      )
    );

    shortIndex += 4;
    fullIndex += 4;
  }

  applySearch();
}

function applySearch() {

  const query = searchInput.value
    .trim()
    .toLowerCase();

  const cards =
    gallery.querySelectorAll(".video-card");

  let visibleCount = 0;

  cards.forEach(card => {

    const title =
      card.dataset.title || "";

    if (
      !query ||
      title.includes(query)
    ) {
      card.style.display = "";
      visibleCount++;
    } else {
      card.style.display = "none";
    }
  });

  noResults.style.display =
    visibleCount === 0
      ? "block"
      : "none";
}

searchInput.addEventListener(
  "input",
  applySearch
);

buildGallery();
</script>

</body>
</html>
